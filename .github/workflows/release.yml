# Builds, tests and signs the APK when a Release is published, then attaches it to the Release.
# Repository secrets needed (Settings → Secrets and variables → Actions):
#   KEYSTORE_BASE64  the ankineer-release.jks file, base64-encoded
#   KEYSTORE_PASSWORD the key password
name: Release APK

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release (tag) to attach the APK to, e.g. v1.0"
        required: true
      name:
        description: "APK file name (Ankineer-Lock-<name>.apk), e.g. V1; empty = the tag. A file with the same name is replaced."
        required: false

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Outils Android (paquets Ubuntu)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q aapt zipalign apksigner dalvik-exchange android-sdk-platform-23 \
            libasm-java libandroid-json-java python3-pil

      - name: Release key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "Secret KEYSTORE_BASE64 manquant"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build + smoke test + signing
        env:
          ANKINEER_KEYSTORE: ${{ runner.temp }}/release.jks
          ANKINEER_KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          NAME: ${{ inputs.name || github.event.release.tag_name || inputs.tag }}
        run: |
          OUT="Ankineer-Lock-$NAME.apk" bash build.sh
          sha256sum "Ankineer-Lock-$NAME.apk" > "Ankineer-Lock-$NAME.apk.sha256"
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Attach the APK to the Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          NAME: ${{ inputs.name || github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$TAG" "Ankineer-Lock-$NAME.apk" "Ankineer-Lock-$NAME.apk.sha256" --clobber
